<!doctype html>
<html>
  <head>
    <title>Python Slots</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <h1>Python Slots</h1>

    <p id="balance">Balance: $100</p>

    <div id="game-container">
      <!-- Left: Image -->

      <div id="side-image">
        <img
          src="{{ url_for('static', filename='assets/OIP.jpg') }}"
          alt="Slot Machine"
        />
      </div>

      <!-- Center: Slot Machine -->

      <div id="game">
        <div id="slots">
          <span id="slot1">🍌</span>
          <span id="slot2">🍒</span>
          <span id="slot3">⭐️</span>
        </div>

        <input id="bet" type="number" value="10" min="1" />

        <button id="spin-button">SPIN 🎰</button>

        <p id="message">{{ message }}</p>
      </div>

      <!-- Right: Statistics -->

      <div id="statistics">
        <h2>📊 Statistics</h2>

        <p id="spins">Spins: 0</p>

        <p id="wins">Wins: 0</p>

        <p id="losses">Losses: 0</p>

        <p id="total-bets">Total Bets: $0</p>

        <p id="total-winnings">Total Winnings: $0</p>

        <p id="biggest-win">Biggest Win: $0</p>
      </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
